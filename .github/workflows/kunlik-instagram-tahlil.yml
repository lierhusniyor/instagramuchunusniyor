name: Kunlik Instagram tahlil

on:
  workflow_dispatch:
  schedule:
    # Har kuni 06:00 UTC (Moskva vaqti bilan 09:00)
    - cron: "0 6 * * *"

jobs:
  hisobot:
    runs-on: ubuntu-latest
    steps:
      - name: Telegramga hisobot yuborish
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Secret topilmadi: TELEGRAM_BOT_TOKEN va TELEGRAM_CHAT_ID ni tekshiring."
            exit 1
          fi

          SANA=$(TZ=Europe/Moscow date +"%Y-%m-%d %H:%M")
          MATN="Kunlik Instagram tahlil (${SANA})
          Workflow ishlayapti. Keyingi qadam: Instagram statistikasini ulash."

          curl --fail --silent --show-error \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MATN}" > /dev/null

          echo "Hisobot yuborildi."
