name: Hello video

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  video:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
      - run: pip install pillow edge-tts
      - name: Ovoz (o'zbek, ayol)
        run: edge-tts --voice uz-UZ-MadinaNeural --rate=-5% --file reels/hello/voice.txt --write-media reels/hello/voice.mp3
      - name: Video
        run: |
          python reels/make_reel.py reels/hello/slides.json reels/hello/silent.mp4
          ffmpeg -y -i reels/hello/silent.mp4 -i reels/hello/voice.mp3 -filter_complex "[1:a]apad[a]" -map 0:v -map "[a]" -shortest -c:v copy -c:a aac -b:a 128k reels/hello/hello-world.mp4
          rm reels/hello/silent.mp4
      - name: Saqlash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reels/hello/hello-world.mp4
          git commit -m "Hello world video (ovozli)" && git pull --rebase -q && git push
