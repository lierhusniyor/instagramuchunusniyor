name: Cyberpunk video

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  video:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
      - run: pip install pillow numpy edge-tts
      - name: Ovoz (quvnoq, yorqin, o'zbek ayol)
        run: edge-tts --voice uz-UZ-MadinaNeural --rate=+12% --pitch=+14Hz --volume=+10% --file reels/cyber/voice.txt --write-media reels/cyber/voice.mp3
      - name: Video, musiqa va yig'ish
        run: |
          VD=$(ffprobe -v error -show_entries format=duration -of csv=p=0 reels/cyber/voice.mp3)
          DUR=$(python3 -c "print(round(max(13.0, float('$VD') + 1.4), 2))")
          echo "ovoz=$VD video=$DUR"
          python3 reels/cyber/make_cyber.py --dur "$DUR" --video reels/cyber/silent.mp4 --music reels/cyber/music.wav
          ffmpeg -y -loglevel error -i reels/cyber/silent.mp4 -i reels/cyber/voice.mp3 -i reels/cyber/music.wav \
            -filter_complex "[1:a]adelay=350|350,volume=1.5[v];[2:a]volume=0.55[m];[v][m]amix=inputs=2:duration=longest:normalize=0,alimiter=limit=0.95[a]" \
            -map 0:v -map "[a]" -t "$DUR" -c:v copy -c:a aac -b:a 160k reels/cyber/cyberpunk.mp4
          rm reels/cyber/silent.mp4 reels/cyber/music.wav
          ls -la reels/cyber
      - name: Saqlash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reels/cyber/cyberpunk.mp4
          git commit -m "Cyberpunk video (ovozli)" && git pull --rebase -q && git push
